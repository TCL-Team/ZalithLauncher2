name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK Components
        run: |
          sdkmanager \
            "platform-tools" \
            "ndk;25.2.9519653"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build all APK variants
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: ./gradlew assemble

      - name: Show generated APKs
        run: find . -name "*.apk"

      # Debug APK sirf Actions artifacts me rahega
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release APK bhi artifact me rahega
      - name: Upload Release APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Release-APKs
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 🚀 GitHub Release - Debug ko chhodkar SABHI Release APK upload karega
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          generate_release_notes: true
          files: |
            **/build/outputs/apk/release/*.apk
            !**/build/outputs/apk/debug/*.apk   # Debug APK ko EXCLUDE karega
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
