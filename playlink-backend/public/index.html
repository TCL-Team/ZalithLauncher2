<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151d">
  <title>PlayLink</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10151d; color: #eef2f8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 620px); padding: 28px; border-radius: 24px; background: #1a222d; box-shadow: 0 18px 55px #0006; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p { color: #b7c2d0; line-height: 1.55; }
    dl { display: grid; grid-template-columns: minmax(120px, 0.45fr) 1fr; gap: 12px 20px; margin: 24px 0; }
    dt { color: #b7c2d0; } dd { margin: 0; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    a, button { border: 0; border-radius: 14px; padding: 12px 18px; font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; }
    .primary { color: #08131d; background: #8bd5ff; }
    .secondary { color: #eef2f8; background: #344252; }
    #status { min-height: 1.5em; color: #f3c977; }
    .hidden { display: none; }
    @media (max-width: 460px) { main { padding: 22px; } dl { grid-template-columns: 1fr; gap: 5px; } dd { margin-bottom: 10px; } }
  </style>
</head>
<body>
<main>
  <h1 id="name">PlayLink</h1>
  <p id="summary">Loading shared Minecraft setup…</p>
  <p id="status" role="status" aria-live="polite"></p>
  <dl id="details" class="hidden">
    <dt>Minecraft version</dt><dd id="minecraft"></dd>
    <dt>Mod loader</dt><dd id="loader"></dd>
    <dt>Mods included</dt><dd id="mods"></dd>
    <dt>Pack size</dt><dd id="size"></dd>
    <dt>Link code</dt><dd id="code"></dd>
  </dl>
  <p id="launcher-instructions" class="hidden">To import in the launcher, choose Enter PlayLink and paste this page URL.</p>
  <div class="actions hidden" id="actions">
    <a class="primary" id="download" rel="nofollow">Download modpack</a>
    <button class="secondary" id="copy" type="button">Copy PlayLink</button>
  </div>
</main>
<script>
(() => {
  const id = location.pathname.split("/").filter(Boolean).at(-1) || "";
  const status = document.getElementById("status");
  const validId = /^[A-Za-z0-9_-]{32}$/.test(id);
  const formatBytes = (size) => {
    if (!Number.isFinite(size) || size <= 0) return "Unknown";
    const units = ["B", "KB", "MB", "GB"];
    let value = size;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
    return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
  };
  if (!validId) {
    status.textContent = "This PlayLink URL is not valid.";
    document.getElementById("summary").textContent = "Check the shared URL and try again.";
    return;
  }
  fetch(`/api/playlink/${encodeURIComponent(id)}`, { headers: { "Accept": "application/json" } })
    .then(async (response) => {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data?.error?.message || "This PlayLink could not be found.");
      return data;
    })
    .then((data) => {
      document.title = `${data.packName || "PlayLink"} · PlayLink`;
      document.getElementById("name").textContent = data.packName || "Minecraft pack";
      document.getElementById("summary").textContent = data.description || "Shared Minecraft setup details.";
      document.getElementById("minecraft").textContent = data.minecraftVersion || "Unknown";
      document.getElementById("loader").textContent = [data.loaderName, data.loaderVersion].filter(Boolean).join(" ") || "Vanilla";
      document.getElementById("mods").textContent = String(data.modCount ?? 0);
      document.getElementById("size").textContent = formatBytes(Number(data.fileSizeBytes));
      document.getElementById("code").textContent = id;
      document.getElementById("details").classList.remove("hidden");
      document.getElementById("launcher-instructions").classList.remove("hidden");
      document.getElementById("actions").classList.remove("hidden");
      const download = document.getElementById("download");
      download.href = data.downloadUrl;
      download.addEventListener("click", (event) => {
        if (!window.confirm("Download this modpack? To import it in the launcher, use Enter PlayLink and confirm there.")) {
          event.preventDefault();
        }
      });
      document.getElementById("copy").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(location.href);
          status.textContent = "PlayLink copied.";
        } catch (_) {
          status.textContent = `Copy this URL: ${location.href}`;
        }
      });
    })
    .catch((error) => {
      status.textContent = error.message || "This PlayLink could not be loaded.";
      document.getElementById("summary").textContent = "The link may be invalid, expired, or temporarily unavailable.";
    });
})();
</script>
</body>
</html>
